name: Build LocalForge Installer

# Triggers:
#  - Push a tag like v1.1.0 to publish a Release with the .exe attached
#  - Or run manually from the Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache here — lockfile is generated during the first npm install
          # below, so there's nothing to key the cache on yet.

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NSIS (for the standalone installer)
        run: choco install nsis -y --no-progress

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1.6" --locked

      - name: Build Tauri app (release)
        run: cargo tauri build
        env:
          # Skip the auto-updater signing step; users can install manually.
          TAURI_PRIVATE_KEY: ''
          TAURI_KEY_PASSWORD: ''

      - name: Show built artifacts
        run: |
          Write-Host "=== Release dir ==="
          Get-ChildItem src-tauri\target\release -Filter *.exe
          Write-Host "=== Bundle dir ==="
          Get-ChildItem src-tauri\target\release\bundle -Recurse -Filter *.exe
        shell: pwsh

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalForge-Setup-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
          draft: false
          prerelease: false
